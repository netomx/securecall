# /etc/turnserver.conf — Kalloq TURN relay on call.l8.nz
# @TURN_SECRET@ is replaced at install time with the value in /etc/kalloq/turn_secret
# (sc-server uses the same secret to issue short-lived TURN credentials).

listening-port=3478
tls-listening-port=5349
listening-ip=72.11.156.223
relay-ip=72.11.156.223
min-port=49152
max-port=65535

realm=call.l8.nz
server-name=call.l8.nz
use-auth-secret
static-auth-secret=@TURN_SECRET@

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20"

fingerprint
stale-nonce=600
user-quota=4
total-quota=400
max-bps=256000

no-cli
no-multicast-peers
no-software-attribute

# Never relay to private, loopback or link-local networks (prevents TURN being used to reach internal hosts)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

syslog
simple-log
