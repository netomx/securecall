# /etc/nginx/sites-available/call.l8.nz
# TLS termination for the signaling server (sc-server listens on 127.0.0.1:8080).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name call.l8.nz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.l8.nz;

    ssl_certificate     /etc/letsencrypt/live/call.l8.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.l8.nz/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    server_tokens off;
    access_log off;

    # Signaling WebSocket
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Android App Links (deep links /a/<uuid>)
    location = /.well-known/assetlinks.json {
        root /var/www/call.l8.nz;
        default_type application/json;
    }

    location /a/ {
        root /var/www/call.l8.nz;
        try_files /invite.html =404;
    }

    location / {
        return 404;
    }
}
