# /etc/kalloq/sc-server.conf
listen = 127.0.0.1
port = 8080
db = /var/lib/kalloq/kalloq.db
turn_secret_file = /etc/kalloq/turn_secret
# Firebase service account (push to wake phones for calls). Without it, push is off.
# fcm_credentials_file = /etc/kalloq/fcm.json
turn_host = call.l8.nz
turn_ttl = 3600
# nginx sets X-Real-IP
trust_proxy = true
rate_limits = true
hash_threads = 1
max_connections = 2000
